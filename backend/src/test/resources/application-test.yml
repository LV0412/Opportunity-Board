spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  mail:
    host: localhost
    port: 2525
  datasource:
    url: jdbc:h2:mem:opportunity_board_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  frontend-url: http://localhost:5173
  jwt:
    secret: change-me-to-a-long-random-secret
    expiration-ms: 86400000
  mail:
    enabled: false
